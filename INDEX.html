<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnonRelay — Terminal Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #33ff33;
  }

  /* CRT scanline overlay */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.08) 0px,
      rgba(0,0,0,0.08) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .container {
    width: 900px;
    max-width: 95vw;
    height: 85vh;
    background: #0d0d0d;
    border: 1px solid #1a3a1a;
    box-shadow: 0 0 30px rgba(51,255,51,0.05), inset 0 0 60px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Title bar */
  .title-bar {
    background: #111;
    border-bottom: 1px solid #1a3a1a;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    flex-shrink: 0;
  }
  .title-bar .title {
    color: #33ff33;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .title-bar .title span.blink {
    animation: blink 1s step-end infinite;
  }
  .title-bar .status {
    font-size: 11px;
    color: #1a6b1a;
  }
  .title-bar .status.online { color: #33ff33; }
  .title-bar .controls {
    display: flex;
    gap: 6px;
  }
  .title-bar .controls span {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #1a3a1a;
  }
  .title-bar .controls span.close { background: #3a1a1a; }
  .title-bar .controls span.minimize { background: #3a3a1a; }

  /* Main display area */
  .display-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: #1a3a1a transparent;
  }
  .display-area::-webkit-scrollbar { width: 4px; }
  .display-area::-webkit-scrollbar-track { background: transparent; }
  .display-area::-webkit-scrollbar-thumb { background: #1a3a1a; }

  /* Boot / landing screen */
  #boot-screen {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
  }
  #boot-screen .line { color: #33ff33; opacity: 0.9; }
  #boot-screen .line.dim { color: #1a6b1a; }
  #boot-screen .line.prompt { color: #33ff33; }
  #boot-screen .cursor-line {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #boot-screen .cursor-line .prompt-sym { color: #33ff33; }
  #boot-screen .cursor-line input {
    background: transparent;
    border: none;
    outline: none;
    color: #33ff33;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    flex: 1;
    caret-color: #33ff33;
  }
  #boot-screen .cursor-line input::placeholder { color: #1a4a1a; }

  /* Chat messages */
  .msg {
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
  }
  .msg .timestamp {
    color: #1a6b1a;
    margin-right: 8px;
  }
  .msg .sender {
    color: #33ff33;
    font-weight: 700;
    margin-right: 6px;
  }
  .msg .sender.remote { color: #ffb833; }
  .msg .text { color: #c0c0c0; }
  .msg.system { color: #1a6b1a; font-style: italic; }
  .msg.system .text { color: #1a6b1a; }
  .msg.error { color: #8a1a1a; }
  .msg.error .text { color: #cc3333; }

  /* Input area */
  .input-area {
    border-top: 1px solid #1a3a1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    background: #0a0a0a;
  }
  .input-area .prompt {
    color: #33ff33;
    font-size: 13px;
    white-space: nowrap;
  }
  .input-area input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #33ff33;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    caret-color: #33ff33;
  }
  .input-area input::placeholder { color: #1a4a1a; }
  .input-area input:disabled { opacity: 0.3; }
  .input-area .send-btn {
    background: transparent;
    border: 1px solid #1a3a1a;
    color: #33ff33;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .input-area .send-btn:hover {
    background: #1a3a1a;
    border-color: #33ff33;
  }
  .input-area .send-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Link display bar */
  .link-bar {
    border-top: 1px solid #1a3a1a;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    background: #080808;
  }
  .link-bar .label {
    color: #1a6b1a;
    font-size: 11px;
    white-space: nowrap;
  }
  .link-bar .link-display {
    flex: 1;
    color: #ffb833;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link-bar .copy-btn {
    background: transparent;
    border: 1px solid #1a3a1a;
    color: #33ff33;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .link-bar .copy-btn:hover {
    background: #1a3a1a;
    border-color: #33ff33;
  }

  /* Action callout */
  .callout {
    border: 1px solid #1a3a1a;
    background: #0d120d;
    padding: 12px 16px;
    margin: 8px 0;
    font-size: 12px;
    color: #33ff33;
  }
  .callout .arrow {
    color: #1a6b1a;
    margin-right: 6px;
  }

  /* Separator */
  .sep {
    border: none;
    border-top: 1px dotted #1a3a1a;
    margin: 6px 0;
  }

  /* Utility */
  .hidden { display: none !important; }
  .fade-in {
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .pulse { animation: pulse 1.5s ease-in-out infinite; }

  /* responsive */
  @media (max-width: 600px) {
    .container { height: 95vh; max-width: 100vw; }
    .title-bar .title { font-size: 11px; }
    .msg { font-size: 12px; }
    .input-area input { font-size: 12px; }
    .display-area { padding: 12px; }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Title bar -->
  <div class="title-bar">
    <div class="title">
      [anon-relay@hackerai]~$ <span class="blink">_</span>
    </div>
    <div class="status" id="status-display">DISCONNECTED</div>
    <div class="controls">
      <span class="minimize"></span>
      <span></span>
      <span class="close"></span>
    </div>
  </div>

  <!-- Display area (chat / boot) -->
  <div class="display-area" id="display-area"></div>

  <!-- Link bar (shown after room creation) -->
  <div class="link-bar" id="link-bar">
    <span class="label">// LINK</span>
    <span class="link-display" id="link-display"></span>
    <button class="copy-btn" id="copy-btn">[COPY]</button>
  </div>

  <!-- Input area -->
  <div class="input-area" id="input-area">
    <span class="prompt" id="prompt">$></span>
    <input type="text" id="msg-input" placeholder="type a message..." autofocus disabled />
    <button class="send-btn" id="send-btn" disabled>[SEND]</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---- DOM refs ----
  const display  = document.getElementById('display-area');
  const input    = document.getElementById('msg-input');
  const sendBtn  = document.getElementById('send-btn');
  const promptEl = document.getElementById('prompt');
  const statusEl = document.getElementById('status-display');
  const linkDisplay = document.getElementById('link-display');
  const linkBar     = document.getElementById('link-bar');
  const copyBtn     = document.getElementById('copy-btn');

  // ---- State ----
  let state = 'boot';          // boot | lobby | connected
  let roomId = null;           // the hash
  let peer = null;
  let conn = null;
  let myId = null;             // 'local' or 'remote'
  let remoteConnected = false;
  let unreadCount = 0;

  // ---- Helpers ----
  function ts() {
    const d = new Date();
    return d.toTimeString().slice(0,5);
  }

  function scrollDown() {
    requestAnimationFrame(() => {
      display.scrollTop = display.scrollHeight;
    });
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  // ---- Render messages to display ----
  function writeRaw(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    div.className = 'fade-in';
    display.appendChild(div);
    scrollDown();
  }

  function writeMsg(type, sender, text, senderClass) {
    const t = ts();
    const senderDisplay = sender ? `<span class="sender ${senderClass || ''}">${sender}</span>` : '';
    const cls = type === 'system' ? 'msg system' : type === 'error' ? 'msg error' : 'msg';
    writeRaw(`<div class="${cls}"><span class="timestamp">[${t}]</span>${senderDisplay}<span class="text">${text}</span></div>`);
  }

  function writeBoot(line, dim) {
    writeRaw(`<div class="line ${dim ? 'dim' : ''}">${line}</div>`);
  }

  // ---- Clear display ----
  function clearDisplay() {
    display.innerHTML = '';
  }

  // ---- Boot sequence ----
  function showBoot() {
    clearDisplay();
    state = 'boot';
    linkBar.classList.add('hidden');
    input.disabled = true;
    sendBtn.disabled = true;
    promptEl.textContent = '$>';
    setStatus('BOOTING', '');

    const lines = [
      '[ ok ] Initializing kernel modules...',
      '[ ok ] Loading network stack...',
      '[ ok ] Generating ephemeral identity...',
      '[ ok ] Starting anonymous relay service...',
    ];
    let i = 0;
    function printNext() {
      if (i < lines.length) {
        writeBoot(lines[i], false);
        i++;
        setTimeout(printNext, 150);
      } else {
        writeBoot('');
        writeBoot('------------------------------------------------');
        writeBoot('  ANON-RELAY v1.0  —  Anonymous Terminal Chat');
        writeBoot('  Messages are ephemeral. No logs. No tracking.');
        writeBoot('------------------------------------------------');
        writeBoot('');
        writeBoot('  Commands:');
        writeBoot('    /create   —  Generate a new anonymous room');
        writeBoot('    /join &lt;code> —  Join an existing room by code');
        writeBoot('');
        writeBoot('  Or scan a QR / open a link someone shared with you.');
        writeBoot('');
        setTimeout(() => {
          writeRaw('<div class="callout"><span class="arrow">>></span> TYPE <strong>/create</strong> TO GENERATE A LINK, OR <strong>/join &lt;CODE&gt;</strong> TO CONNECT</div>');
          writeBoot('');
          writeRaw('<div class="cursor-line"><span class="prompt-sym">$></span><input type="text" id="boot-input" placeholder="type a command..." autofocus /></div>');
          const bootInput = document.getElementById('boot-input');
          if (bootInput) {
            bootInput.focus();
            bootInput.addEventListener('keydown', handleBootKey);
          }
          setStatus('AWAITING INPUT', '');
          scrollDown();
        }, 200);
      }
    }
    printNext();
  }

  // ---- Boot input handler ----
  function handleBootKey(e) {
    if (e.key === 'Enter') {
      const val = e.target.value.trim();
      if (!val) return;
      // echo the command
      writeRaw(`<div class="line">$> ${val}</div>`);
      e.target.value = '';

      const parts = val.split(/\s+/);
      const cmd = parts[0].toLowerCase();

      if (cmd === '/create') {
        createRoom();
      } else if (cmd === '/join' && parts[1]) {
        joinRoom(parts[1]);
      } else if (cmd === '/help') {
        writeRaw('<div class="callout">COMMANDS: /create | /join &lt;code&gt; | /help</div>');
        scrollDown();
        // re-focus
        setTimeout(() => {
          const bi = document.getElementById('boot-input');
          if (bi) bi.focus();
        }, 50);
      } else {
        writeRaw('<div class="msg error"><span class="text">Unknown command. Try /create or /join &lt;code&gt;</span></div>');
        setTimeout(() => {
          const bi = document.getElementById('boot-input');
          if (bi) bi.focus();
        }, 50);
      }
    }
  }

  // ---- Create room ----
  function createRoom() {
    roomId = generateRoomId();
    const url = window.location.origin + window.location.pathname + '#' + roomId;
    linkDisplay.textContent = url;
    linkBar.classList.remove('hidden');
    setStatus('WAITING FOR PEER', 'pulse');

    // Clear boot, show lobby
    clearDisplay();
    state = 'lobby';

    writeRaw(`<div class="msg system"><span class="timestamp">[${ts()}]</span><span class="text">Room created. Waiting for peer...</span></div>`);
    writeRaw(`<div class="callout"><span class="arrow">>></span> SHARE THIS LINK WITH YOUR TARGET. WHEN THEY OPEN IT, THE CHAT WILL BEGIN.</div>`);
    writeRaw(`<hr class="sep">`);

    // Set up local input
    promptEl.textContent = 'YOU>';
    input.disabled = true;
    sendBtn.disabled = true;
    input.placeholder = 'waiting for peer...';

    // Start listening for a peer via hash
    startSignaling(roomId, 'local');
    myId = 'local';

    // Update URL hash
    window.location.hash = roomId;
  }

  // ---- Join room ----
  function joinRoom(code) {
    const clean = code.replace(/^#/, '');
    roomId = clean;
    const url = window.location.origin + window.location.pathname + '#' + roomId;
    linkDisplay.textContent = url;
    linkBar.classList.remove('hidden');

    clearDisplay();
    state = 'lobby';

    writeRaw(`<div class="msg system"><span class="timestamp">[${ts()}]</span><span class="text">Joining room ${roomId}...</span></div>`);
    writeRaw(`<hr class="sep">`);

    promptEl.textContent = 'YOU>';
    input.disabled = true;
    sendBtn.disabled = true;
    input.placeholder = 'connecting...';

    setStatus('CONNECTING', 'pulse');
    startSignaling(roomId, 'remote');
    myId = 'remote';

    window.location.hash = roomId;
  }

  // ---- Generate room ID ----
  function generateRoomId() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let id = '';
    for (let i = 0; i < 8; i++) {
      id += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return id;
  }

  // ---- Simple signaling via BroadcastChannel (same-origin) + localStorage fallback ----
  // We use a polling-based signaling channel via localStorage for cross-tab
  // Since we want real peer-to-peer, we'll use a simple approach:
  // Use localStorage events for signaling (works across tabs on same origin)
  // For truly different origins/devices, we'd need a server — but for this
  // pentest tool, we'll use a combined approach.

  let signalingChannel = null;
  let signalInterval = null;

  function startSignaling(room, role) {
    // Try BroadcastChannel first
    try {
      signalingChannel = new BroadcastChannel('anonrelay-' + room);
      signalingChannel.onmessage = (e) => {
        handleSignal(e.data, role);
      };
    } catch(e) {
      // Fallback to localStorage polling
    }

    // Also set up localStorage signaling for cross-tab
    setupLocalStorageSignaling(room, role);
  }

  function setupLocalStorageSignaling(room, role) {
    const key = 'anonrelay_signal_' + room;

    // Listen for storage events (fired on other tabs)
    window.addEventListener('storage', (e) => {
      if (e.key === key && e.newValue) {
        try {
          const data = JSON.parse(e.newValue);
          handleSignal(data, role);
        } catch(_) {}
      }
    });

    // Send our offer/answer via localStorage
    window.sendSignal = (data) => {
      try {
        localStorage.setItem(key, JSON.stringify(data));
        // Clear it so next event fires
        setTimeout(() => { localStorage.removeItem(key); }, 100);
      } catch(_) {}
    };

    // If we're local (creator), broadcast our offer after a short delay
    if (role === 'local') {
      setTimeout(() => {
        createOffer(room);
      }, 500);
    } else {
      // remote: listen for offer
      setTimeout(() => {
        // Try to see if there's already data
        try {
          const existing = localStorage.getItem(key);
          if (existing) {
            const data = JSON.parse(existing);
            handleSignal(data, role);
          }
        } catch(_) {}
      }, 300);
    }
  }

  // ---- WebRTC ----
  let pc = null;
  let dataChannel = null;
  let pendingCandidates = [];

  function createOffer(room) {
    try {
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });

      dataChannel = pc.createDataChannel('chat', { ordered: true });
      setupDataChannel();

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          // Send candidate via signal
          const msg = { type: 'candidate', candidate: e.candidate, room: room };
          if (signalingChannel) signalingChannel.postMessage(msg);
          if (window.sendSignal) window.sendSignal(msg);
        }
      };

      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
          onPeerConnected();
        } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          onPeerDisconnected();
        }
      };

      pc.createOffer()
        .then(offer => pc.setLocalDescription(offer))
        .then(() => {
          const msg = { type: 'offer', sdp: pc.localDescription, room: room };
          if (signalingChannel) signalingChannel.postMessage(msg);
          if (window.sendSignal) window.sendSignal(msg);
        })
        .catch(err => {
          writeMsg('error', '', 'Failed to create offer: ' + err.message);
        });
    } catch(err) {
      writeMsg('error', '', 'WebRTC not supported: ' + err.message);
    }
  }

  function handleSignal(data, role) {
    if (!pc && data.type === 'offer') {
      // Create peer connection for answer
      try {
        pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        });

        pc.ondatachannel = (e) => {
          dataChannel = e.channel;
          setupDataChannel();
        };

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            const msg = { type: 'candidate', candidate: e.candidate, room: data.room };
            if (signalingChannel) signalingChannel.postMessage(msg);
            if (window.sendSignal) window.sendSignal(msg);
          }
        };

        pc.oniceconnectionstatechange = () => {
          if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
            onPeerConnected();
          } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
            onPeerDisconnected();
          }
        };

        pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
          .then(() => pc.createAnswer())
          .then(answer => pc.setLocalDescription(answer))
          .then(() => {
            const msg = { type: 'answer', sdp: pc.localDescription, room: data.room };
            if (signalingChannel) signalingChannel.postMessage(msg);
            if (window.sendSignal) window.sendSignal(msg);
          })
          .catch(err => {
            writeMsg('error', '', 'Failed to handle offer: ' + err.message);
          });
      } catch(err) {
        writeMsg('error', '', 'WebRTC error: ' + err.message);
      }
    } else if (data.type === 'answer' && pc && !pc.currentRemoteDescription) {
      pc.setRemoteDescription(new RTCSessionDescription(data.sdp))
        .catch(err => {
          writeMsg('error', '', 'Failed to set answer: ' + err.message);
        });
    } else if (data.type === 'candidate' && pc && pc.remoteDescription) {
      pc.addIceCandidate(new RTCIceCandidate(data.candidate))
        .catch(err => {
          // Ignore candidate errors
        });
    }
  }

  function setupDataChannel() {
    if (!dataChannel) return;

    dataChannel.onopen = () => {
      onPeerConnected();
    };

    dataChannel.onclose = () => {
      onPeerDisconnected();
    };

    dataChannel.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'chat') {
        writeMsg('chat', 'TARGET', msg.text, 'remote');
        unreadCount++;
      }
    };
  }

  function onPeerConnected() {
    if (remoteConnected) return;
    remoteConnected = true;
    setStatus('CONNECTED', 'online');
    state = 'connected';

    writeMsg('system', '', 'Peer connected. Channel is secure.');

    // Enable input
    input.disabled = false;
    sendBtn.disabled = false;
    input.placeholder = 'type a message...';
    input.focus();
    promptEl.textContent = 'YOU>';

    // If this was lobby, finalize
    if (linkBar.classList.contains('hidden')) {
      linkBar.classList.remove('hidden');
    }
  }

  function onPeerDisconnected() {
    if (!remoteConnected) return;
    remoteConnected = false;
    setStatus('DISCONNECTED', '');
    state = 'lobby';

    writeMsg('system', '', 'Peer disconnected. Waiting for reconnection...');

    input.disabled = true;
    sendBtn.disabled = true;
    input.placeholder = 'peer disconnected...';
    promptEl.textContent = '$>';
  }

  // ---- Send message ----
  function sendMessage() {
    const text = input.value.trim();
    if (!text || !dataChannel || dataChannel.readyState !== 'open') return;

    const payload = JSON.stringify({ type: 'chat', text: text });
    dataChannel.send(payload);

    writeMsg('chat', 'YOU', text, '');
    input.value = '';
    input.focus();
  }

  // ---- Copy link ----
  copyBtn.addEventListener('click', () => {
    const url = linkDisplay.textContent;
    navigator.clipboard.writeText(url).then(() => {
      copyBtn.textContent = '[COPIED]';
      setTimeout(() => { copyBtn.textContent = '[COPY]'; }, 2000);
    }).catch(() => {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent = '[COPIED]';
      setTimeout(() => { copyBtn.textContent = '[COPY]'; }, 2000);
    });
  });

  // ---- Input events ----
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ---- Check hash on load for auto-join ----
  function checkHash() {
    const hash = window.location.hash.slice(1);
    if (hash && hash.length >= 6) {
      // Auto-join
      setTimeout(() => {
        joinRoom(hash);
      }, 800);
      return true;
    }
    return false;
  }

  // ---- Init ----
  function init() {
    if (!checkHash()) {
      showBoot();
    } else {
      // Boot sequence shortened then join
      clearDisplay();
      writeBoot('[ ok ] Anonymous relay starting...');
      writeBoot('[ ok ] Detected room link in URL.');
      writeBoot('[ ok ] Auto-joining...');
      setStatus('AUTO-JOINING', 'pulse');
      linkBar.classList.remove('hidden');
      // The join happens via checkHash -> joinRoom after timeout
    }
  }

  init();

  // Handle hash changes (someone pastes a new link)
  window.addEventListener('hashchange', () => {
    const hash = window.location.hash.slice(1);
    if (hash && hash.length >= 6 && hash !== roomId) {
      if (confirm('[ANON-RELAY] Switch to room ' + hash + '?')) {
        // Clean up old connection
        if (dataChannel) dataChannel.close();
        if (pc) pc.close();
        pc = null;
        dataChannel = null;
        remoteConnected = false;
        if (signalInterval) clearInterval(signalInterval);
        joinRoom(hash);
      }
    }
  });

  // Export for terminal use
  window.ANON_RELAY = {
    createRoom: createRoom,
    joinRoom: joinRoom,
    sendMessage: sendMessage,
    getState: () => ({ state, roomId, connected: remoteConnected })
  };

  console.log('%c[ANON-RELAY]','color:#33ff33',' Terminal chat loaded. Use window.ANON_RELAY to control programmatically.');

})();
</script>
